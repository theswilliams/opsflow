name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsflow_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: opsflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests use this server instead of starting an embedded one.
      TEST_DATABASE_URL: postgresql://opsflow_test:ci-only-password@localhost:5432/opsflow_test
      DATABASE_URL: postgresql://opsflow_test:ci-only-password@localhost:5432/opsflow_test
    steps:
      # Third-party actions are pinned to full commit SHAs (tags are mutable). Update deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migration safeguards (no migration may drop a protected constraint/trigger)
        run: npm run check:migrations
      - name: Schema ↔ migrations drift (replay every migration into a scratch database and compare with schema.prisma)
        run: |
          PGPASSWORD=ci-only-password psql -h localhost -U opsflow_test -d opsflow_test -c 'CREATE DATABASE opsflow_shadow'
          SHADOW_DATABASE_URL=postgresql://opsflow_test:ci-only-password@localhost:5432/opsflow_shadow \
            npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholder only (32 zero bytes); no real secret is used in CI.
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
